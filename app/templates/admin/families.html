{% extends "base.html" %}
{% block title %}Admin — Families{% endblock %}
{% block content %}
<h2>Manage Families</h2>

<form method="post" action="{{ url_for('admin.new_family') }}">
  <fieldset role="group">
    <input type="text" name="name" placeholder="New family name" required>
    <button type="submit">Create</button>
  </fieldset>
</form>

<figure>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Members</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for family in families %}
      <tr>
        <td>
          <form method="post" action="{{ url_for('admin.edit_family', id=family.id) }}" style="display:inline;">
            <fieldset role="group">
              <input type="text" name="name" value="{{ family.name }}" required>
              <button type="submit" class="outline secondary">Rename</button>
            </fieldset>
          </form>
        </td>
        <td>{{ family.members | map(attribute='name') | join(', ') or '—' }}</td>
        <td>
          <form method="post" action="{{ url_for('admin.delete_family', id=family.id) }}">
            <button class="outline secondary">Delete</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</figure>

<p><a href="{{ url_for('admin.people_list') }}">&larr; Back to People</a></p>
{% endblock %}
