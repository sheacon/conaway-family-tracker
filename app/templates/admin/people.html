{% extends "base.html" %}
{% block title %}Admin — Family Members{% endblock %}
{% block content %}
<h2>Family Members</h2>
<p><a href="{{ url_for('admin.family_list') }}" role="button" class="outline">Manage Families</a></p>

<form method="post" action="{{ url_for('admin.toggle_notifications') }}" style="margin-bottom: 1rem;">
  {% if notifications_paused %}
  <mark>Trip notifications are paused</mark>
  <button type="submit" class="outline">Resume Notifications</button>
  {% else %}
  <button type="submit" class="outline secondary">Pause Notifications</button>
  {% endif %}
</form>

<form method="post" action="{{ url_for('admin.new_person') }}">
  <fieldset role="group">
    <input type="text" name="name" placeholder="New person's name" required>
    <input type="email" name="email" placeholder="Email (optional)">
    <input type="text" name="abbreviation" placeholder="Abbr" maxlength="10" style="max-width: 5rem;">
    <select name="family_id">
      <option value="">No family</option>
      {% for fam in families %}
      <option value="{{ fam.id }}">{{ fam.name }}</option>
      {% endfor %}
    </select>
    <button type="submit">Add Person</button>
  </fieldset>
</form>
<figure>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Abbr</th>
        <th>Email</th>
        <th>Family</th>
        <th>Default Location</th>
        <th>Color</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for person in people %}
      <tr>
        <td>{{ person.name }}</td>
        <td>{{ person.abbreviation or '—' }}</td>
        <td>{{ person.email or '—' }}</td>
        <td>{{ person.family.name if person.family else '—' }}</td>
        <td>{{ person.default_location_label }}</td>
        <td><span class="color-dot" style="background: {{ person.color }};"></span></td>
        <td>
          <a href="{{ url_for('admin.edit_person', id=person.id) }}" role="button" class="outline secondary">Edit</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</figure>
{% endblock %}
