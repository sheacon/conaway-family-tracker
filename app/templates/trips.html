{% extends "base.html" %}
{% block title %}All Trips{% endblock %}
{% block content %}
<h2>All Trips</h2>
{% if trips %}
<figure>
  <table>
    <thead>
      <tr>
        <th>Dates</th>
        <th>Who</th>
        <th>Trip</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for trip in trips %}
      <tr>
        <td>{{ trip.start_date.strftime('%b %-d') }} – {{ trip.end_date.strftime('%b %-d, %Y') }}</td>
        <td>
          {% set groups = trip.people | group_by_family %}
          {% if groups %}
            {% for fam, names in groups.items() %}
              {% if fam %}<strong>{{ fam }}:</strong> {% endif %}{{ names | join(', ') }}{% if not loop.last %}<br>{% endif %}
            {% endfor %}
          {% else %}—{% endif %}
          {% if trip.flight_info %}
            <br><small>
            {% for fi in trip.flight_info %}
              {{ fi.person.name }}:
              {% if fi.outbound_flight %}&#9992; {{ fi.outbound_flight | flight_link }}{% endif %}
              {% if fi.outbound_flight and fi.return_flight %} / {% endif %}
              {% if fi.return_flight %}&#9992; {{ fi.return_flight | flight_link }}{% endif %}
              {% if not loop.last %}<br>{% endif %}
            {% endfor %}
            </small>
          {% endif %}
        </td>
        <td>
          {% if trip.title %}{{ trip.title }}<br><small>{{ trip.destinations_summary if trip.is_multi_stop else trip.destination }}</small>
          {% else %}{{ trip.destinations_summary if trip.is_multi_stop else trip.destination }}{% endif %}
          {% if trip.is_multi_stop %}
            <br><small>
            {% for stop in trip.stops %}
              &nbsp;&nbsp;{{ stop.destination }}: {{ stop.start_date.strftime('%b %-d') }}–{{ stop.end_date.strftime('%b %-d') }}{% if not loop.last %}<br>{% endif %}
            {% endfor %}
            </small>
          {% endif %}
          {% if trip.notes %}<br><small><em>{{ trip.notes }}</em></small>{% endif %}
        </td>
        <td>
          <a href="{{ url_for('trips.edit_trip', id=trip.id) }}" role="button" class="outline secondary">Edit</a>
          <form method="post" action="{{ url_for('trips.delete_trip', id=trip.id) }}" style="display:inline">
            <button type="submit" class="outline secondary" onclick="return confirm('Delete this trip?')">Delete</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</figure>
{% else %}
<p>No trips yet. <a href="{{ url_for('trips.new_trip') }}">Add one!</a></p>
{% endif %}
{% endblock %}
