{% extends "base.html" %}
{% block title %}All Trips{% endblock %}
{% block content %}
<h2>All Trips</h2>
<p>
  {% if show_past %}
    <a href="{{ url_for('trips.trip_list') }}">Hide past trips</a>
  {% else %}
    <a href="{{ url_for('trips.trip_list', show_past='1') }}">Show past trips</a>
  {% endif %}
</p>
{% if trips %}
<figure>
  <table>
    <thead>
      <tr>
        <th>Trip</th>
        <th>Dates</th>
        <th>Who</th>
        <th>Transportation</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for trip in trips %}
      <tr>
        <td>
          {% if trip.title %}{{ trip.title }}<br><small>{{ trip.destinations_summary if trip.is_multi_stop else trip.destination }}</small>
          {% else %}{{ trip.destinations_summary if trip.is_multi_stop else trip.destination }}{% endif %}
          {% if trip.is_multi_stop %}
            <br><small>
            {% for stop in trip.stops %}
              &nbsp;&nbsp;{{ stop.destination }}: {{ stop.start_date | format_date }}–{{ stop.end_date | format_date }}{% if not loop.last %}<br>{% endif %}
            {% endfor %}
            </small>
          {% endif %}
          {% if trip.notes %}<br><small><em>{{ trip.notes }}</em></small>{% endif %}
        </td>
        <td>{{ trip | date_range }}</td>
        <td>
          {{ trip.people | map(attribute='name') | join(', ') or '—' }}
        </td>
        <td>
          {% if trip.transport_mode == 'flying' %}
            {% if trip.outbound_flight or trip.return_flight %}
              {% if trip.outbound_flight %}🛫 {{ trip.outbound_flight | flight_link }}{% endif %}
              {% if trip.outbound_flight and trip.return_flight %} / {% endif %}
              {% if trip.return_flight %}🛬 {{ trip.return_flight | flight_link }}{% endif %}
            {% else %}🛫{% endif %}
          {% elif trip.transport_mode == 'driving' %}🚗
          {% elif trip.transport_mode == 'train' %}🚂
          {% elif trip.transport_mode == 'boat' %}🛳️
          {% endif %}
        </td>
        <td>
          <a href="{{ url_for('trips.edit_trip', id=trip.id) }}" role="button" class="outline secondary">Edit</a>
          <form method="post" action="{{ url_for('trips.delete_trip', id=trip.id) }}">
            <button type="submit" class="outline secondary" onclick="return confirm('Delete this trip?')">Delete</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</figure>
{% else %}
<p>No trips yet. <a href="{{ url_for('trips.new_trip') }}">Add one!</a></p>
{% endif %}
{% endblock %}
