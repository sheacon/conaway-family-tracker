{% extends "base.html" %}
{% block content %}
<h2>Current Locations</h2>

<div id="map" style="height: 400px; border-radius: var(--pico-border-radius); margin-bottom: 1rem;"></div>

<figure>
  <table>
    <thead>
      <tr><th>Name</th><th>Location</th></tr>
    </thead>
    <tbody>
      {% for loc in locations %}
      <tr>
        <td>{{ loc.name }}</td>
        <td>{{ loc.label }}{% if loc.traveling %} <mark>traveling</mark>{% endif %}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</figure>

{% if upcoming %}
<h3>Upcoming Trips</h3>
<figure>
  <table>
    <thead>
      <tr><th>Destination</th><th>Who</th><th>Dates</th></tr>
    </thead>
    <tbody>
      {% for trip in upcoming %}
      <tr>
        <td>{{ trip.destination }}</td>
        <td>{{ trip.people | map(attribute='name') | join(', ') or '—' }}</td>
        <td>{{ trip.start_date.strftime('%b %-d') }} – {{ trip.end_date.strftime('%b %-d, %Y') }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</figure>
{% endif %}
{% endblock %}

{% block scripts %}
<script>
  const locations = {{ locations | tojson }};

  const map = L.map('map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // Group people by coordinates (rounded to avoid float mismatch)
  const groups = {};
  locations.forEach(loc => {
    const key = loc.lat.toFixed(4) + ',' + loc.lng.toFixed(4);
    if (!groups[key]) groups[key] = { lat: loc.lat, lng: loc.lng, names: [] };
    groups[key].names.push(loc.name + (loc.traveling ? ' (traveling)' : ''));
  });

  const bounds = [];
  Object.values(groups).forEach(g => {
    const popup = g.names.join('<br>');
    L.marker([g.lat, g.lng]).addTo(map).bindPopup(popup);
    bounds.push([g.lat, g.lng]);
  });

  if (bounds.length > 1) {
    map.fitBounds(bounds, { padding: [40, 40] });
  } else if (bounds.length === 1) {
    map.setView(bounds[0], 5);
  } else {
    map.setView([39.8283, -98.5795], 4);
  }
</script>
{% endblock %}
