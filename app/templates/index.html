{% extends "base.html" %}
{% block content %}
{% if upcoming %}
<h2>Planned Trips</h2>
<div class="upcoming-scroll">
<figure>
  <table>
    <thead>
      <tr><th>Trip</th><th>Dates</th><th>Who</th><th>Mode</th></tr>
    </thead>
    <tbody>
      {% for trip in upcoming %}
      <tr>
        <td>
          {% if trip.title %}{{ trip.title }}<br><small>{{ trip.destinations_summary if trip.is_multi_stop else trip.destination }}</small>
          {% else %}{{ trip.destinations_summary if trip.is_multi_stop else trip.destination }}{% endif %}
          {% if trip.notes %}<br><small><em>{{ trip.notes }}</em></small>{% endif %}
        </td>
        <td class="dates-col">
          {{ trip | date_range }}
          {% if trip.is_active %} <mark>in progress</mark>{% endif %}
        </td>
        <td>
          {{ trip.people | map(attribute='name') | join(', ') or '—' }}
        </td>
        <td>
          {% if trip.transport_mode == 'flying' %}
            {% if trip.outbound_flight or trip.return_flight %}
              {% if trip.outbound_flight %}🛫 {{ trip.outbound_flight | flight_link }}{% endif %}
              {% if trip.outbound_flight and trip.return_flight %} / {% endif %}
              {% if trip.return_flight %}🛬 {{ trip.return_flight | flight_link }}{% endif %}
            {% else %}🛫{% endif %}
          {% elif trip.transport_mode == 'driving' %}🚗
          {% elif trip.transport_mode == 'train' %}🚂
          {% elif trip.transport_mode == 'boat' %}🛳️
          {% endif %}
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</figure>
</div>
{% endif %}

<h2>Current Locations</h2>

{% if has_map_image %}
<img src="{{ url_for('trips.map_image') }}" alt="Conaway Family Map" style="width: 100%; aspect-ratio: 16/9; object-fit: contain; border-radius: var(--pico-border-radius); margin-bottom: 1rem;">
{% endif %}

<figure>
  <table>
    <thead>
      <tr><th>Name</th><th>Current Location</th><th>Next Trip</th></tr>
    </thead>
    {% for family_name, members in family_groups.items() %}
    <tbody>
      <tr><th colspan="3">{{ family_name }}</th></tr>
      {% for loc in members %}
      <tr>
        <td>
          <span class="color-dot" style="background: {{ loc.color }};"></span>
          {{ loc.name }}
        </td>
        <td>
          {{ loc.label }}{% if loc.travel_day %} <mark>in transit</mark>{% elif loc.traveling %} <mark>traveling</mark>{% endif %}
          {% if loc.traveling %}
            {% if loc.trip_destination != loc.label %}<br><small>{{ loc.trip_destination }}</small>{% endif %}
            <br><small>{{ loc.trip_dates }}</small>
          {% endif %}
          {% if loc.stop_info %}<br><small>{{ loc.stop_info }}</small>{% endif %}
          {% if loc.flight %}
            <br><small>{% if loc.flight.label == "Outbound" %}🛫{% else %}🛬{% endif %} {{ loc.flight.number | flight_link }} ({{ loc.flight.label }})</small>
          {% endif %}
        </td>
        <td>
          {% if loc.next_trip %}
            {% if loc.next_trip.title %}{{ loc.next_trip.title }}<br><small>{{ loc.next_trip.destination }}</small>
            {% else %}{{ loc.next_trip.destination }}{% endif %}
            <br><small>{{ loc.next_trip.dates }}</small>
            {% if loc.next_trip.notes %}<br><small><em>{{ loc.next_trip.notes }}</em></small>{% endif %}
          {% else %}—{% endif %}
        </td>
      </tr>
      {% endfor %}
    </tbody>
    {% endfor %}
  </table>
</figure>
{% endblock %}
