{% extends "base.html" %}
{% block content %}
{% if upcoming %}
<h2>Upcoming Trips</h2>
<div class="upcoming-scroll">
<figure>
  <table>
    <thead>
      <tr><th>Trip</th><th>Who</th></tr>
    </thead>
    <tbody>
      {% for trip in upcoming %}
      <tr>
        <td>
          {% if trip.title %}{{ trip.title }}<br><small>{{ trip.destination }}</small>
          {% else %}{{ trip.destination }}{% endif %}
          <br><small>{{ trip.start_date.strftime('%b %-d') }} – {{ trip.end_date.strftime('%b %-d, %Y') }}</small>
          {% if trip.notes %}<br><small><em>{{ trip.notes }}</em></small>{% endif %}
        </td>
        <td>
          {% set groups = trip.people | group_by_family %}
          {% if groups %}
            {% for fam, names in groups.items() %}
              {% if fam %}<strong>{{ fam }}:</strong> {% endif %}{{ names | join(', ') }}{% if not loop.last %}<br>{% endif %}
            {% endfor %}
          {% else %}—{% endif %}
          {% if trip.flight_info %}
            <br><small>
            {% for fi in trip.flight_info %}
              {{ fi.person.name }}:
              {% if fi.outbound_flight %}&#9992; {{ fi.outbound_flight | flight_link }}{% endif %}
              {% if fi.outbound_flight and fi.return_flight %} / {% endif %}
              {% if fi.return_flight %}&#9992; {{ fi.return_flight | flight_link }}{% endif %}
              {% if not loop.last %}<br>{% endif %}
            {% endfor %}
            </small>
          {% endif %}
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</figure>
</div>
{% endif %}

<h2>Current Locations</h2>

<div id="map" style="height: 400px; border-radius: var(--pico-border-radius); margin-bottom: 1rem;"></div>

<figure>
  <table>
    <thead>
      <tr><th>Name</th><th>Current Location</th><th>Next Trip</th></tr>
    </thead>
    {% for family_name, members in family_groups.items() %}
    <tbody>
      <tr><th colspan="3">{{ family_name }}</th></tr>
      {% for loc in members %}
      <tr>
        <td>
          <span class="color-dot" style="background: {{ loc.color }};"></span>
          {{ loc.name }}
        </td>
        <td>
          {{ loc.label }}{% if loc.traveling %} <mark>traveling</mark>{% endif %}
          {% if loc.flight %}
            <br><small>&#9992; <a href="{{ loc.flight.url }}" target="_blank">{{ loc.flight.number }}</a> ({{ loc.flight.label }})</small>
          {% endif %}
        </td>
        <td>
          {% if loc.next_trip %}
            {% if loc.next_trip.title %}{{ loc.next_trip.title }}<br><small>{{ loc.next_trip.destination }}</small>
            {% else %}{{ loc.next_trip.destination }}{% endif %}
            <br><small>{{ loc.next_trip.dates }}</small>
            {% if loc.next_trip.notes %}<br><small><em>{{ loc.next_trip.notes }}</em></small>{% endif %}
          {% else %}—{% endif %}
        </td>
      </tr>
      {% endfor %}
    </tbody>
    {% endfor %}
  </table>
</figure>
{% endblock %}

{% block scripts %}
<script>
  const locations = {{ locations | tojson }};

  const map = L.map('map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  function makePinSvg(color) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="25" height="41" viewBox="0 0 25 41">
      <path d="M12.5 0C5.6 0 0 5.6 0 12.5C0 21.9 12.5 41 12.5 41S25 21.9 25 12.5C25 5.6 19.4 0 12.5 0z" fill="${color}" stroke="#fff" stroke-width="1.5"/>
      <circle cx="12.5" cy="12.5" r="5" fill="#fff" opacity="0.9"/>
    </svg>`;
    return 'data:image/svg+xml;base64,' + btoa(svg);
  }

  // Group by coordinates for offset calculation
  const groups = {};
  locations.forEach(loc => {
    const key = loc.lat.toFixed(4) + ',' + loc.lng.toFixed(4);
    if (!groups[key]) groups[key] = [];
    groups[key].push(loc);
  });

  const bounds = [];
  Object.values(groups).forEach(group => {
    const n = group.length;
    group.forEach((loc, i) => {
      // Pixel offset for co-located people
      let offsetX = 0, offsetY = 0;
      if (n > 1) {
        const angle = (2 * Math.PI * i) / n - Math.PI / 2;
        const radius = 14;
        offsetX = Math.cos(angle) * radius;
        offsetY = Math.sin(angle) * radius;
      }

      const icon = L.divIcon({
        className: 'svg-marker',
        html: `<img src="${makePinSvg(loc.color)}" width="25" height="41">`,
        iconSize: [25, 41],
        iconAnchor: [12.5 - offsetX, 41 - offsetY],
        popupAnchor: [0, -41],
      });

      const marker = L.marker([loc.lat, loc.lng], { icon }).addTo(map);
      const status = loc.traveling ? ' <em>(traveling)</em>' : '';
      marker.bindPopup(`<strong>${loc.name}</strong><br>${loc.label}${status}`);
      bounds.push([loc.lat, loc.lng]);
    });
  });

  if (bounds.length > 1) {
    map.fitBounds(bounds, { padding: [40, 40] });
  } else if (bounds.length === 1) {
    map.setView(bounds[0], 5);
  } else {
    map.setView([39.8283, -98.5795], 4);
  }
</script>
{% endblock %}
