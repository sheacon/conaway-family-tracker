name: Daily trip notifications

# Keep-alive: touched 2026-07-02 to reset GitHub's 60-day scheduled-workflow inactivity timer.

on:
  schedule:
    - cron: "0 12 * * *" # 8 AM EDT (12 PM UTC)
  workflow_dispatch: # allow manual trigger

jobs:
  send-notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: |
          # Wake the machine via HTTP (auto_start_machines handles this)
          curl -s -o /dev/null --max-time 30 https://conaway-family-tracker.fly.dev/ || true
          sleep 5
          flyctl ssh console -a conaway-family-tracker -C "uv run --no-dev flask generate-map"
          flyctl ssh console -a conaway-family-tracker -C "uv run --no-dev flask send-notifications"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
