name: Daily trip notifications

on:
  schedule:
    - cron: "0 13 * * *" # 8 AM ET (1 PM UTC)
  workflow_dispatch: # allow manual trigger

jobs:
  send-notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: |
          # Wake the machine via HTTP (auto_start_machines handles this)
          curl -s -o /dev/null --max-time 30 https://conaway-family-tracker.fly.dev/ || true
          sleep 5
          flyctl ssh console -a conaway-family-tracker -C "flask send-notifications"
          flyctl ssh console -a conaway-family-tracker -C "flask generate-map"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
