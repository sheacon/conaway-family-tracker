[project]
name = "conaway-family-tracker"
version = "1.0.0"
description = "Family travel tracker — Flask web app for tracking travel plans with interactive map"
requires-python = ">=3.13"
dependencies = [
    "Flask==3.1.1",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Migrate==4.1.0",
    "Flask-Login==0.6.3",
    "gunicorn==23.0.0",
    "python-dotenv==1.1.0",
    "resend==2.23.0",
    "google-genai>=1.0.0",
    "Pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "freezegun==1.5.5",
    "ruff",
]
