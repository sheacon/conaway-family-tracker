app = "conaway-family-tracker"
primary_region = "ord"

[build]

[env]
  DATABASE_URL = "sqlite:////data/app.db"
  FLASK_APP = "app:create_app"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "data"
  destination = "/data"
